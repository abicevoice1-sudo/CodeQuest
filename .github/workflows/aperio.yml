# Copy this to your repo as .github/workflows/codequest.yml
# Fails the PR when it introduces new CRITICAL-risk modules or circular imports.
name: CodeQuest drift check

on:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan PR head
        run: ./aperio/bin/aperio scan .

      - name: Scan base branch
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add /tmp/cq-base "origin/${{ github.base_ref }}"
          ./aperio/bin/aperio scan /tmp/cq-base

      - name: Architecture drift gate
        # Fails on: new CRITICAL-risk modules (or escalations to CRITICAL),
        # new circular imports. Tune with --fail-on critical,cycles,escalations.
        run: ./aperio/bin/aperio diff /tmp/cq-base .aperio/graph.json
